function sess(){try{return JSON.parse(localStorage.getItem('noaman_supabase_session')||'null')}catch(e){return null}}
function saveSess(x){if(x)localStorage.setItem('noaman_supabase_session',JSON.stringify(x));else localStorage.removeItem('noaman_supabase_session')}

async function refreshSession(){
  const x=sess();
  if(!x?.refresh_token)return null;
  try{
    const ctl=new AbortController();const timer=setTimeout(()=>ctl.abort(),15000);
    const r=await fetch(SB_URL+'/auth/v1/token?grant_type=refresh_token',{
      method:'POST',headers:HDR,body:JSON.stringify({refresh_token:x.refresh_token}),signal:ctl.signal
    });
    clearTimeout(timer);
    const t=await r.text(); let d; try{d=t?JSON.parse(t):null}catch(e){d=null}
    if(!r.ok||!d?.access_token)return null;
    saveSess(d); return d;
  }catch(e){return null}
}
async function api(path,opt={},retry=true){
  let h={...HDR,...(opt.headers||{})},x=sess();
  if(x?.access_token)h.Authorization='Bearer '+x.access_token;
  let r;
  try{
    const ctl=new AbortController();
    const timer=setTimeout(()=>ctl.abort(),15000);
    r=await fetch(SB_URL+path,{...opt,headers:h,signal:ctl.signal});
    clearTimeout(timer);
  }catch(e){return {data:null,error:{message:'تعذر الاتصال بالخادم'}}}
  if(r.status===401 && retry && x?.refresh_token){
    const n=await refreshSession();
    if(n)return api(path,opt,false);
  }
  const txt=await r.text(); let data;
  try{data=txt?JSON.parse(txt):null}catch(e){data=txt}
  if(!r.ok){
    const msg=data?.message||data?.msg||data?.error_description||data?.error||('HTTP '+r.status);
    return {data:null,error:{message:msg,status:r.status}}
  }
  return {data,error:null}
}

function qstr(v){return encodeURIComponent(v)}
class Query{
 constructor(table){this.table=table;this.params=[];this.method='GET';this.body=null;this.wantSingle=false;this.returnRep=false;this.selectCols='*'}
 select(cols='*'){this.selectCols=cols;return this}
 order(col,{ascending=true}={}){this.params.push('order='+qstr(col+'.'+(ascending?'asc':'desc')));return this}
 limit(n){this.params.push('limit='+n);return this}
 eq(c,v){this.params.push(c+'=eq.'+qstr(v));return this}
 or(expr){this.params.push('or=('+encodeURIComponent(expr)+')');return this}
 single(){this.wantSingle=true;this.params.push('limit=1');return this}
 insert(row){this.method='POST';this.body=Array.isArray(row)?row:[row];this.returnRep=true;return this}
 update(row){this.method='PATCH';this.body=row;this.returnRep=true;return this}
 delete(){this.method='DELETE';this.returnRep=true;return this}
 then(resolve,reject){return this.run().then(resolve,reject)}
 async run(){
   let path='/rest/v1/'+this.table;
   if(this.method==='GET'){
     let p=this.params.slice();
     if(this.selectCols)p.unshift('select='+qstr(this.selectCols));
     path+='?'+p.join('&');
   }else if(this.params.length)path+='?'+this.params.join('&');
   let headers={};
   if(this.returnRep)headers.Prefer='return=representation';
   let r=await api(path,{method:this.method,headers,body:this.body?JSON.stringify(this.body):undefined});
   if(r.error)return r;
   let data=r.data;
   if(this.wantSingle&&Array.isArray(data))data=data[0]||null;
   // return=representation يجب أن يعيد السجل المتأثر؛ الفراغ يعني أن شرط id لم يطابق سجلًا.
   if((this.method==='PATCH'||this.method==='DELETE')&&Array.isArray(data)&&data.length===0){
     return {data:null,error:{message:'لم يتأثر أي سجل بهذه العملية'}};
   }
   return {data,error:null}
 }
}
/* ================= Offline-First Sync Layer ================= */
const OFFLINE_DB='noaman_hybrid_v1';
let netOnline=navigator.onLine;
const pendingWrites=[];
let syncRunning=false;
async function getMeta(key){return tx('meta','readonly',s=>new Promise((res,rej)=>{const q=s.get(key);q.onsuccess=()=>res(q.result?.value);q.onerror=()=>rej(q.error)}))}
async function setMeta(key,value){return tx('meta','readwrite',s=>s.put({key,value}))}
async function queueCount(){try{return (await getQueue()).length}catch(e){return 0}}
async function updateSyncWidget(){const el=document.getElementById('sync-widget');if(!el)return;const pending=await queueCount();const uploaded=Number(await getMeta('last_sync_uploaded')||0);const lastError=String(await getMeta('last_sync_error')||'');const b=document.getElementById('sync-remaining'),r=document.getElementById('sync-result');if(b){b.textContent=String(pending);b.className='sync-badge'+(pending?'':' sync-ok')}if(r){r.textContent=pending?(lastError?'المتبقي: '+pending+' — '+lastError.slice(0,70):'المتبقي: '+pending):'آخر مزامنة: '+(uploaded||0)+' سجل'}}
function showSyncWidget(){if(document.getElementById('sync-widget')){updateSyncWidget();return}const d=document.createElement('div');d.id='sync-widget';d.className='sync-widget';d.innerHTML='<span>☁️ غير متزامن</span><span id="sync-remaining" class="sync-badge">0</span><button id="sync-now-btn" onclick="manualSync()">مزامنة الآن</button><span id="sync-result" class="sync-result"></span>';document.body.insertBefore(d,document.body.firstChild);updateSyncWidget()}
async function manualSync(){const btn=document.getElementById('sync-now-btn');if(!navigator.onLine){msg('لا يوجد اتصال بالإنترنت حاليًا');return}if(btn)btn.disabled=true;try{const before=await queueCount();if(before===0){msg('لا توجد بيانات معلقة للمزامنة');await updateSyncWidget();return}const uploaded=await syncNow(true),after=await queueCount();msg(after===0?'تمت مزامنة جميع البيانات مع السحابة':'تمت مزامنة '+Number(uploaded||0)+' بيانات، والمتبقي '+Number(after||0));await updateSyncWidget()}catch(e){msg('تعذر إكمال المزامنة: '+(e?.message||'خطأ غير معروف'));await updateSyncWidget()}finally{if(btn)btn.disabled=false}}
function setNetState(v){

  b.style.background=netOnline?'#166534':'#b45309';

function idb(){return new Promise((res,rej)=>{const r=indexedDB.open(OFFLINE_DB,6);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('rows')){let s=d.createObjectStore('rows',{keyPath:'key'});s.createIndex('table','table',{unique:false})}if(!d.objectStoreNames.contains('queue'))d.createObjectStore('queue',{keyPath:'qid',autoIncrement:true});if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta',{keyPath:'key'});try{d.transaction.objectStore('meta').put({key:'db_schema_v6',value:new Date().toISOString()})}catch(e){}};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function tx(store,mode,fn){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction(store,mode),s=t.objectStore(store);let out;try{out=fn(s,t)}catch(e){rej(e);return}t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error)})}
async function putRows(table,rows){return tx('rows','readwrite',s=>{(rows||[]).forEach(r=>{if(r&&r.id!=null)s.put({key:table+':'+r.id,table,row:r})})})}
async function getRows(table){return tx('rows','readonly',s=>new Promise((res,rej)=>{let a=[],q=s.index('table').openCursor(IDBKeyRange.only(table));q.onsuccess=()=>{let c=q.result;if(c){a.push(c.value.row);c.continue()}else res(a)};q.onerror=()=>rej(q.error)}))}
async function deleteRowLocal(table,id){return tx('rows','readwrite',s=>s.delete(table+':'+id))}
async function clearTableLocal(table){return tx('rows','readwrite',s=>{let q=s.index('table').openCursor(IDBKeyRange.only(table));q.onsuccess=()=>{let c=q.result;if(c){c.delete();c.continue()}}})}
async function enqueue(op){const qid=await tx('queue','readwrite',s=>s.add({...op,queue_schema:4}));await updateSyncWidget();return qid}

function localFilter(rows,q){

function project(rows,cols){
  if(!cols||cols==='*'||cols.includes('*'))return rows;
  const wanted=cols.split(',').map(x=>x.trim()).filter(x=>x&&x!=='*');
  return rows.map(r=>{let o={};wanted.forEach(c=>{let m=c.match(/^(\w+)\(([^)]+)\)$/);if(m)o[m[1]]={};else if(c in r)o[c]=r[c]});return o})
}

async function reconcileRemoteTable(table,remoteRows){
  // دمج آمن: لا نستبدل سجلًا محليًا غنيًا بنسخة خادمة ناقصة، ونحافظ على العمليات المعلقة.
  const remote=Array.isArray(remoteRows)?remoteRows.map(x=>({...x})):[];
  const local=await getRows(table);
  const qs=(await getQueue()).filter(x=>x.table===table);
  const localById=new Map(local.map(x=>[String(x.id),x]));
  const remoteById=new Map(remote.map(x=>[String(x.id),x]));
  const populatedCount=o=>Object.entries(o||{}).filter(([k,v])=>k!=='id'&&v!==null&&v!==undefined&&v!=='').length;
  const rows=[];

  for(const [id,rr] of remoteById){
    const ll=localById.get(id);
    if(ll && populatedCount(ll)>populatedCount(rr)) rows.push({...rr,...ll});
    else rows.push(rr);
  }
  for(const [id,ll] of localById){
    if(remoteById.has(id)) continue;
    if(populatedCount(ll)>1) rows.push(ll);
  }

  for(const item of qs){
    if(item.method==='POST'){
      const ll=localById.get(String(item.localId));
      if(ll && !rows.some(x=>String(x.id)===String(item.localId))) rows.push(ll);
      continue;
    }
    const idm=item.params?.find(x=>x.startsWith('id=eq.'));
    const id=idm?decodeURIComponent(idm.slice(7)):null;
    if(id==null) continue;
    if(item.method==='PATCH'){
      const idx=rows.findIndex(x=>String(x.id)===String(id));
      if(idx>=0) rows[idx]={...rows[idx],...item.body};
    }else if(item.method==='DELETE'){
      const idx=rows.findIndex(x=>String(x.id)===String(id));
      if(idx>=0) rows.splice(idx,1);
    }
  }
  await clearTableLocal(table);
  await putRows(table,rows);
  return rows;
}

async function refreshCanonicalCaches(){
  if(!navigator.onLine)return false;
  let ok=0;
  for(const t of await localTables()){
    const r=await api('/rest/v1/'+t+'?select=*',{method:'GET'});
    if(!r.error&&Array.isArray(r.data)){ok++;await reconcileRemoteTable(t,r.data)}
  }
  return ok=== (await localTables()).length;
}

}

Query.prototype.run=async function(){
  const qy=this;
  if(qy.method==='GET'){
    // ONLINE = Supabase is the authoritative source. Never return stale cache first.
    // The old implementation returned IndexedDB immediately and refreshed in the background;
    // that could render an old/temporary ID and then send that ID to an update/delete RPC.
    if(navigator.onLine){
      let r=await _QueryRun.call(qy);
      if(!r.error){
        if(Array.isArray(r.data) && isCacheTable(qy.table)) await putRows(qy.table,r.data);
        setNetState(true);
        return r;
      }
      // Only fall back to local data for an actual network failure. HTTP/RLS/schema errors
      // must remain visible instead of silently replacing the server error with stale rows.
      if(isNetworkFailure(r)){
        setNetState(false);
        return localQuery(qy);
      }
      setNetState(true);
      return r;
    }
    // OFFLINE = IndexedDB is authoritative until the queue is synchronized.
    return localQuery(qy);
  }
  if(navigator.onLine){
    let r=await _QueryRun.call(qy);
    if(!r.error){
      if(qy.method==='POST'&&Array.isArray(r.data)&&r.data.length)await putRows(qy.table,r.data);
      else if(qy.method==='PATCH'){let rr=await getRows(qy.table),idp=qy.params.find(x=>x.startsWith('id=eq.')),id=idp?decodeURIComponent(idp.slice(7)):null;await putRows(qy.table,rr.map(x=>String(x.id)===String(id)?{...x,...qy.body}:x))}

    }

    // لا نضيف العملية إلى قائمة المزامنة إلا عند انقطاع/فشل الشبكة فعليًا.
    if(isNetworkFailure(r)){setNetState(false);}else return r;
  }

  let rows=await getRows(qy.table), body=Array.isArray(qy.body)?qy.body[0]:qy.body, localId;

  let idp=qy.params.find(x=>x.startsWith('id=eq.'));let id=idp?decodeURIComponent(idp.slice(7)):null;
  if(qy.method==='PATCH'){let out=rows.map(x=>String(x.id)===String(id)?{...x,...body}:x);await putRows(qy.table,out);await enqueue({table:qy.table,method:'PATCH',params:qy.params,body});await updateSyncWidget();return {data:out.find(x=>String(x.id)===String(id))||null,error:null,offline:true}}

async function cachePatch(table,id,body){
  const rows=await getRows(table);
  let found=false;
  const out=rows.map(x=>{if(String(x.id)===String(id)){found=true;return {...x,...body,id:x.id}}return x});
  if(found)await putRows(table,out);
  return found;
}

async function cancelPendingCreate(table,id){
  const qs=await getQueue();
  const create=qs.find(q=>q.table===table&&q.method==='POST'&&String(q.localId)===String(id));
  if(!create)return false;
  for(const q of qs){
    const same=q.table===table && (q.qid===create.qid || String(q.localId)===String(id) || (q.params||[]).some(p=>p==='id=eq.'+encodeURIComponent(id)));
    if(same)await removeQueue(q.qid);
  }
  await deleteRowLocal(table,id);
  await updateSyncWidget();
  return true;
}

  const total=vals.reduce((a,b)=>a+b,0);
  const percent=vals.length ? Math.round((total/(vals.length*100))*10000)/100 : null;
  let result=null;
  if(vals.length){
    const anyFail=ids.some(id=>{const v=score(id);return v!==null && v<50});
    result=anyFail?'راسب':'ناجح';
  }
  const assessment=studentAssessment(percent);
  if($('stotal'))$('stotal').value=vals.length?total:'';
  if($('spercent'))$('spercent').value=percent===null?'':percent;
  if($('sresult'))$('sresult').value=result||'';
  if($('assessment_grade'))$('assessment_grade').value=assessment;
  return {total:vals.length?total:null,percentage:percent,result,assessment_grade:assessment};
}

async function setNextSerial(table,id,editingId){
  const el=$(id);
  if(!el)return;
  el.readOnly=true;
  el.tabIndex=-1;
  el.setAttribute("aria-readonly","true");
  el.setAttribute("autocomplete","off");
  el.onkeydown=()=>false;
  el.onpaste=()=>false;

  // الرقم التسلسلي هو ترتيب السجل الفعلي، وليس قيمة id في قاعدة البيانات.
  // لذلك لا نستخدم count/head أو id نفسه؛ فقد تكون هناك أرقام id محذوفة أو غير متتابعة.
  try{
    let rows=[];
    if(navigator.onLine){
      const q=await SB.from(table).select("id").order("id",{ascending:true}).limit(10000);
      if(!q.error && Array.isArray(q.data)) rows=q.data;
    }
    if(!rows.length){
      rows=await getRows(table);
      rows=rows.slice().sort((a,b)=>Number(a.id)-Number(b.id));
    }

    if(editingId!=null){
      const idx=rows.findIndex(x=>String(x.id)===String(editingId));
      el.value=idx>=0?String(idx+1):String(rows.length+1);
    }else{
      el.value=String(rows.length+1);
    }
  }catch(e){
    // في حال تعذر القراءة لا نغيّر أي بيانات، ونستخدم العدد المحلي إن توفر.
    try{
      const rows=await getRows(table);
      const idx=editingId!=null?rows.slice().sort((a,b)=>Number(a.id)-Number(b.id)).findIndex(x=>String(x.id)===String(editingId)):-1;
      el.value=editingId!=null&&idx>=0?String(idx+1):String(rows.length+1);
    }catch(_){el.value="";}
  }
}

async function resolveSchoolIdForWrite(schoolId){
  if(!schoolId)return null;
  const sid=String(schoolId);
  // المدرسة التي أُنشئت أثناء عدم الاتصال قد تحمل id محليًا سالبًا.
  // إذا عاد الإنترنت قبل مزامنة المدرسة، ارفع المدرسة أولًا ثم استخدم id الخادم.
  if(navigator.onLine && Number(sid)<0){
    const qs=await getQueue();
    const qi=qs.find(q=>q.table==='schools'&&q.method==='POST'&&String(q.localId)===sid);
    if(qi){
      const rr=await api('/rest/v1/schools',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(qi.body)});
      if(rr.error)return {error:rr.error};
      const created=Array.isArray(rr.data)?rr.data[0]:rr.data;
      if(created?.id!=null){
        await deleteRowLocal('schools',qi.localId);
        await putRows('schools',[created]);
        const studentsLocal=await getRows('students');
        const changedStudents=studentsLocal.filter(x=>String(x.school_id)===sid).map(x=>({...x,school_id:created.id}));
        if(changedStudents.length)await putRows('students',changedStudents);
        const employeesLocal=await getRows('employees');
        const changedEmployees=employeesLocal.filter(x=>String(x.workplace_id)===sid).map(x=>({...x,workplace_id:created.id}));
        if(changedEmployees.length)await putRows('employees',changedEmployees);
        for(const x of qs){
          if(x.qid===qi.qid)continue;
          let b=x.body?{...x.body}:x.body;
          if(b&&String(b.school_id)===sid)b.school_id=created.id;
          if(b&&String(b.workplace_id)===sid)b.workplace_id=created.id;
          if(b&&JSON.stringify(b)!==JSON.stringify(x.body))await tx('queue','readwrite',st=>st.put({...x,body:b}));
        }
        await removeQueue(qi.qid);
        await updateSyncWidget();
        return created.id;
      }
    }
  }
  return schoolId;
}

 let r;
 if(employeeEdit){
   if(navigator.onLine){
     r=await SB.rpc("admin_update_employee",{p_id:employeeEdit,p_row:row});
   }else{
     r=await SB.from("employees").update(row).eq("id",employeeEdit);
   }
   if(r.error){msg("تعذر تعديل الموظف: "+r.error.message);return}

   await cachePatch('employees',employeeEdit,row);
 }else{

 }

 clearDraft('employees');clearEmployee();await loadEmployees()
}
function clearEmployee(){employeeEdit=null;["en","nat","fin","job","nid","phone","qual","spec","edate","qdate","current"].forEach(i=>{if($(i))$(i).value=""})}
async function editEmployee(id){
 let r=await SB.from("employees").select("*").eq("id",id).single();
 if(r.error){msg("تعذر تحميل بيانات الموظف: "+r.error.message);return}
 let x=r.data;if(!x){msg("الموظف غير موجود");return}
 employeeEdit=id;$("eserial").value=x.id;
 Object.entries({en:x.employee_name,eg:x.gender,nat:x.nationality,fin:x.financial_number,job:x.job_number,nid:x.national_id,phone:x.phone,qual:x.qualification,spec:x.specialization,edate:x.employment_date,qdate:x.qualification_date,current:x.current_job,ew:x.workplace_id,es:x.employment_status}).forEach(([i,a])=>{if($(i))$(i).value=a??""});
 scrollTo(0,0)
}
async function deleteEmployee(id){
 if(!confirm("هل أنت متأكد من حذف الموظف؟"))return;
 if(!navigator.onLine && await cancelPendingCreate('employees',id)){msg('تم إلغاء الموظف المحلي');await loadEmployees();return}
 let r;
 if(navigator.onLine)r=await SB.rpc("admin_delete_employee",{p_id:id});
 else r=await SB.from("employees").delete().eq("id",id);
 if(r.error){msg('تعذر حذف الموظف: '+(r.error.message||'خطأ غير معروف'));return;}
 if(navigator.onLine && (r.data===null||r.data===undefined)){msg('لم يتم حذف الموظف: لم يصل أمر الحذف إلى السجل');return;}
 await cacheDelete('employees',id);
 msg(r.offline?'تم حذف الموظف محليًا — ستتم المزامنة عند عودة الإنترنت':'تم الحذف');
 await loadEmployees();
}
async function loadEmployees(){
 let q=V('eq'),z=SB.from('employees_with_experience').select('*').order('id',{ascending:true}).limit(500);
 if(q)z=z.or('employee_name.ilike.%'+q+'%,job_number.ilike.%'+q+'%');
 let r;
 if(navigator.onLine){
   const remote=await _QueryRun.call(z);
   if(remote.error){
     if(isNetworkFailure(remote)) r=await localQuery(z);
     else { er.innerHTML='<tr><td colspan="17">تعذر تحميل الموظفين من الخادم: '+esc(remote.error.message||'خطأ غير معروف')+'</td></tr>'; return; }
   }else{
     // العرض يعتمد على جدول employees المحلي بعد دمج نسخة الخادم، حتى لا تضيع
     // السجلات التي أضيفت/عُدلت محليًا ولم تصل إلى الخادم بعد.
     const base=await _QueryRun.call(SB.from('employees').select('*').order('id',{ascending:true}).limit(500));
     if(!base.error) await reconcileRemoteTable('employees',base.data||[]);
     r=await localQuery(z);
   }
 }else r=await localQuery(z);
 let rows=r.data||[];
 er.innerHTML=rows.map((x,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(x.employee_name)+'</td><td>'+esc(x.gender||'')+'</td><td>'+esc(x.nationality||'')+'</td><td>'+esc(x.financial_number||'')+'</td><td>'+esc(x.job_number||'')+'</td><td>'+esc(x.national_id||'')+'</td><td>'+esc(x.phone||'')+'</td><td>'+esc(x.qualification||'')+'</td><td>'+esc(x.specialization||'')+'</td><td>'+esc(x.employment_date||'')+'</td><td>'+esc(x.qualification_date||'')+'</td><td>'+esc(x.current_job||'')+'</td><td>'+esc(x.workplace_name||'')+'</td><td>'+esc(x.employment_status||'')+'</td><td>'+esc(x.experience_years??'')+'</td><td><button class="btn light" onclick="editEmployee('+x.id+')">تعديل</button><button class="btn danger" onclick="deleteEmployee('+x.id+')">حذف</button></td></tr>').join('')||'<tr><td colspan="17">لا توجد بيانات</td></tr>';
}
